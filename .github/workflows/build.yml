# Windows-only manual build for the ScriptWriter fork.
# Adapted from the upstream NEO build workflow; publishing is intentionally
# left to the maintainer rather than being triggered by tags.
# Fork source: NEO commit 9d8ba5adbfdaa4d7c1d02a702274d47ae0b46812.

name: Build ScriptWriter (Windows)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install pypdf
      - run: npm test
      - run: npm run package:win
      - uses: actions/upload-artifact@v4
        with:
          name: scriptwriter-windows-x64
          path: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
          if-no-files-found: error
